<title>Private</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #1d2127; --muted: #6b7280;
          --line: #d5d9e0; --accent: #1f5fbf; --bad: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181d; --fg: #e6e8eb; --muted: #9aa3ad; --line: #343a43;
            --accent: #6aa0ff; --bad: #ff8a80; } }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.4 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 48px 16px; }
  #lock { max-width: 420px; margin: 12vh auto 0; display: grid; gap: 10px; }
  input, button { font: inherit; padding: 10px 12px; border-radius: 8px;
                  border: 1px solid var(--line); background: transparent; color: inherit; }
  button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #msg { min-height: 1.4em; margin: 0; color: var(--bad); }
  #bar { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  #info { color: var(--muted); }
  textarea { width: 100%; height: 70vh; box-sizing: border-box; padding: 10px;
             border: 1px solid var(--line); border-radius: 8px; background: transparent;
             color: inherit; font: 12px/1.35 Consolas, ui-monospace, monospace; }
</style>

const $ = id => document.getElementById(id);
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock() {
  const pw = $("pw"), msg = $("msg"), go = $("go");
  if (!window.crypto || !crypto.subtle) { msg.textContent = "This browser can't unlock the page."; return; }
  go.disabled = true; msg.textContent = "";
  try {
    const base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pw.value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(P.salt), iterations: P.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.ct));
    const text = new TextDecoder().decode(plain);
    pw.value = "";
    $("text").value = text;
    $("info").textContent = text.split("\n").length - 1 + " lines";
    $("lock").hidden = true; $("out").hidden = false;
  } catch (e) {
    msg.textContent = "Wrong password.";
    go.disabled = false; pw.select();
  }
}
async function copyAll() {
  const t = $("text"), info = $("info");
  t.focus(); t.select();
  let ok = false;
  try { await navigator.clipboard.writeText(t.value); ok = true; }
  catch (e) { try { ok = document.execCommand("copy"); } catch (e2) { ok = false; } }
  info.textContent = ok ? "Copied - paste it into Notepad." : "Press Ctrl+C to copy.";
}
$("go").addEventListener("click", unlock);
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
$("copy").addEventListener("click", copyAll);
$("pw").focus();
</script>
